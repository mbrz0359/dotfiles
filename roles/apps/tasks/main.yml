---
- name: Remove unneeded packages
  ansible.builtin.package:
    name:
      - baobab
      - decibels
      - evince
      - gnome-boxes
      - gnome-calculator
      - gnome-calendar
      - gnome-clocks
      - gnome-connections
      - gnome-contacts
      - gnome-font-viewer
      - gnome-logs
      - gnome-maps
      - gnome-system-monitor
      - gnome-text-editor
      - gnome-weather
      - libreoffice-core
      - loupe
      - mediawriter
      - papers
      - rhythmbox
      - snapshot
    state: absent
  become: true

- name: Install packages
  ansible.builtin.package:
    name:
      - ptyxis
  become: true

- name: Add the flathub flatpak repository remote
  community.general.flatpak_remote:
    name: flathub
    flatpakrepo_url: https://dl.flathub.org/repo/flathub.flatpakrepo

- name: Install flatpaks
  community.general.flatpak:
    name: "{{ item }}"
  loop: "{{ apps_flatpaks + apps_group_flatpaks }}"
  register: flatpak_result # ansible-lint allows ignore_errors only with a register
  ignore_errors: "{{ ansible_facts['architecture'] != 'x86_64' }}" # Not every flatpak is available on aarch64
  become: true
