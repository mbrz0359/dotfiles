# The firmware passes cgroup_disable=memory; a later cgroup_enable=memory wins.
# Needed for container memory limits (e.g. Mealie).
- name: Enable memory cgroup
  ansible.builtin.lineinfile:
    path: /boot/firmware/cmdline.txt
    regexp: '^((?!.*\bcgroup_enable=memory\b).*)$'
    line: '\1 cgroup_enable=memory'
    backrefs: true
  become: true
  notify: Reboot

- name: Point 127.0.1.1 at the inventory hostname
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\s'
    line: "127.0.1.1\t{{ inventory_hostname }}"
  become: true

- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"
  become: true
