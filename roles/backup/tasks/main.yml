---
- name: Create local bin directory
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.local/bin"
    state: directory
    mode: "0755"

- name: Copy backup script
  ansible.builtin.copy:
    src: rsync-backup
    dest: "{{ ansible_facts['user_dir'] }}/.local/bin/rsync-backup"
    mode: "0755"

- name: Create backup config directory
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/rsync-backup"
    state: directory
    mode: "0700"

- name: Copy backup config
  ansible.builtin.copy:
    src: "{{ inventory_hostname }}/config.sh"
    dest: "{{ ansible_facts['user_dir'] }}/.config/rsync-backup/config.sh"
    mode: "0600"
  diff: false

- name: Back up with a systemd timer
  become: "{{ backup_scope == 'system' }}"
  vars:
    backup_unit_dir: "{{ '/etc/systemd/system' if backup_scope == 'system' else ansible_facts['user_dir'] ~ '/.config/systemd/user' }}"
  block:
    - name: Create systemd unit directory
      ansible.builtin.file:
        path: "{{ backup_unit_dir }}"
        state: directory
        mode: "0755"

    - name: Install backup service
      ansible.builtin.template:
        src: rsync-backup.service.j2
        dest: "{{ backup_unit_dir }}/rsync-backup.service"
        mode: "0644"

    - name: Install backup timer
      ansible.builtin.copy:
        src: rsync-backup.timer
        dest: "{{ backup_unit_dir }}/rsync-backup.timer"
        mode: "0644"

    - name: Enable backup timer
      ansible.builtin.systemd_service:
        name: rsync-backup.timer
        enabled: true
        state: started
        daemon_reload: true
        scope: "{{ backup_scope }}"
