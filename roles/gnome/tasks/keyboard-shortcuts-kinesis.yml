---
- name: Set keyboard shortcuts for switching to given workspace
  community.general.dconf:
    key: "/org/gnome/desktop/wm/keybindings/switch-to-workspace-{{ item }}"
    value: "['<Super>{{ item }}']"
  loop: "{{ range(1, 10) | list }}"
  loop_control:
    label: "switch-to-workspace-{{ item }}"

- name: Set keyboard shortcuts for moving between workspaces
  community.general.dconf:
    key: "/org/gnome/desktop/wm/keybindings/{{ item.key }}"
    value: "{{ item.value }}"
  loop_control:
    label: "{{ item.key }}"
  loop:
    - { key: switch-to-workspace-up, value: "['']" }
    - { key: switch-to-workspace-down, value: "['']" }
    - { key: switch-to-workspace-left, value: "['<Control><Alt>Up']" }
    - { key: switch-to-workspace-right, value: "['<Control><Alt>Down']" }
    - { key: move-to-workspace-left, value: "['<Super>Page_Up']" }
    - { key: move-to-workspace-right, value: "['<Super>Page_Down']" }

- name: Disable keyboard shortcuts for switching applications
  community.general.dconf:
    key: "/org/gnome/shell/keybindings/switch-to-application-{{ item }}"
    value: "['']"
  loop: "{{ range(1, 10) | list }}"
  loop_control:
    label: "switch-to-application-{{ item }}"
