---
- name: Include git config vars
  ansible.builtin.include_vars:
    file: "{{ inventory_hostname }}/git-config.yml"

- name: Set git user name
  community.general.git_config:
    name: user.name
    scope: global
    value: "{{ git.username }}"

- name: Set git email
  community.general.git_config:
    name: user.email
    scope: global
    value: "{{ git.email }}"
