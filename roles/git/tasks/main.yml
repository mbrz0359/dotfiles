---
- name: Git config
  ansible.builtin.include_tasks: git.yml

- name: Git allowed signers
  ansible.builtin.include_tasks: allowed-signers.yml
  when: "'work' not in group_names"

- name: Git commit signing
  ansible.builtin.include_tasks: signing.yml

- name: Git hooks
  ansible.builtin.include_tasks: hooks.yml
  when: "'work' not in group_names"
