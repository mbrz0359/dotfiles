---
- name: Check if mise is installed
  ansible.builtin.command: mise --version
  register: result
  ignore_errors: true
  changed_when: false

- name: Install mise
  when: result is failed
  block:
    - name: Create mise directory
      ansible.builtin.file:
        path: "{{ ansible_workspace_dir }}/mise"
        state: directory
        mode: "0755"

    - name: Download mise install script
      ansible.builtin.get_url:
        url: https://mise.run
        dest: "{{ ansible_workspace_dir }}/mise/install.sh"
        mode: "+x"
        owner: "{{ ansible_facts['user_id'] }}"

    - name: Run mise install script
      ansible.builtin.command: "{{ ansible_workspace_dir }}/mise/install.sh"
      changed_when: true

- name: Enable automatic updates
  ansible.builtin.command: mise settings self_update.auto=true
  changed_when: false

- name: Add minimum release age excludes
  ansible.builtin.command: mise settings minimum_release_age_excludes=claude
  changed_when: false
