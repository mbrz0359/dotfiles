---
- name: Deploy FreshRSS
  community.docker.docker_container:
    name: fresh-rss
    image: freshrss/freshrss:1.30.4
    ports:
      - "8112:80"
    volumes:
      - "{{ ansible_docker_dir }}/fresh-rss/data:/var/www/FreshRSS/data"
      - "{{ ansible_docker_dir }}/fresh-rss/extensions:/var/www/FreshRSS/extensions"
    env:
      TZ: "{{ timezone }}"
      CRON_MIN: "1,31"
    restart_policy: unless-stopped
  become: true

# Only www-data can read some data directories; rsync-backup needs them
- name: Let me read FreshRSS data
  ansible.builtin.user:
    name: "{{ ansible_facts['user_id'] }}"
    groups: www-data
    append: true
  become: true
