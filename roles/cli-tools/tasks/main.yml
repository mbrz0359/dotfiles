---
- name: Install cli tools
  ansible.builtin.package:
    name: "{{ cli_tools_packages + cli_tools_group_packages }}"
  become: true

# cli-tools-<group>.toml applies to the hosts in that group
- name: Install cli tools with mise
  ansible.builtin.copy:
    src: "cli-tools-{{ item }}.toml"
    dest: "{{ mise_conf_dir }}/"
    mode: "0644"
  loop: "{{ ['common'] + group_names }}"
  when: (role_path ~ '/files/cli-tools-' ~ item ~ '.toml') is file
  notify: Mise install
