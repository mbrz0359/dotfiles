---
# One directory per release, so a version bump downloads the new release
- name: Create Nerd Fonts directory
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.local/share/fonts/nerd-fonts-{{ fonts_nerd_fonts_version }}"
    state: directory
    mode: "0755"

- name: Install JetBrains Mono Nerd Font
  ansible.builtin.unarchive:
    src: "https://github.com/ryanoasis/nerd-fonts/releases/download/{{ fonts_nerd_fonts_version }}/JetBrainsMono.zip"
    dest: "{{ ansible_facts['user_dir'] }}/.local/share/fonts/nerd-fonts-{{ fonts_nerd_fonts_version }}"
    include: JetBrainsMonoNLNerdFont-Regular.ttf
    remote_src: true
    creates: "{{ ansible_facts['user_dir'] }}/.local/share/fonts/nerd-fonts-{{ fonts_nerd_fonts_version }}/JetBrainsMonoNLNerdFont-Regular.ttf"

# Includes the font file that earlier versions of this role put in the top-level directory
- name: Find other Nerd Fonts versions
  ansible.builtin.find:
    paths: "{{ ansible_facts['user_dir'] }}/.local/share/fonts"
    patterns:
      - nerd-fonts-*
      - JetBrainsMonoNLNerdFont-*.ttf
    excludes: nerd-fonts-{{ fonts_nerd_fonts_version }}
    file_type: any
  register: fonts_old_nerd_fonts

- name: Remove other Nerd Fonts versions
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ fonts_old_nerd_fonts.files }}"
  loop_control:
    label: "{{ item.path | basename }}"

- name: Set GNOME font settings
  community.general.dconf:
    key: "/org/gnome/desktop/interface/{{ item.key }}"
    value: "{{ item.value }}"
  loop_control:
    label: "{{ item.key }}"
  loop:
    - { key: font-antialiasing, value: "'rgba'" }
    - { key: font-hinting, value: "'full'" }
    - { key: font-name, value: "'Adwaita Sans 12'" }
    - { key: monospace-font-name, value: "'JetBrainsMonoNL Nerd Font 14'" }
