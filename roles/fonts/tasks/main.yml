---
- name: Create fonts directory
  ansible.builtin.file:
    path: "{{ fonts_dir }}"
    state: directory
    mode: "0755"

# The file doesn't exist before the first install
- name: Read installed Nerd Fonts version
  ansible.builtin.slurp:
    src: "{{ fonts_dir }}/.nerd-fonts-version"
  register: fonts_nerd_fonts_installed
  failed_when: false

# A fixed path, so apps that loaded the old font keep working after an update
- name: Install JetBrains Mono Nerd Font
  ansible.builtin.unarchive:
    src: "https://github.com/ryanoasis/nerd-fonts/releases/download/{{ fonts_nerd_fonts_version }}/JetBrainsMono.zip"
    dest: "{{ fonts_dir }}"
    include: JetBrainsMonoNLNerdFont-Regular.ttf
    remote_src: true
  when: (fonts_nerd_fonts_installed.content | default('') | b64decode) != fonts_nerd_fonts_version

- name: Record installed Nerd Fonts version
  ansible.builtin.copy:
    content: "{{ fonts_nerd_fonts_version }}"
    dest: "{{ fonts_dir }}/.nerd-fonts-version"
    mode: "0644"

- name: Set GNOME font settings
  community.general.dconf:
    key: "/org/gnome/desktop/interface/{{ item.key }}"
    value: "{{ item.value }}"
  loop_control:
    label: "{{ item.key }}"
  loop:
    - { key: font-antialiasing, value: "'rgba'" }
    - { key: font-hinting, value: "'full'" }
    - { key: font-name, value: "'Adwaita Sans 12'" }
    - { key: monospace-font-name, value: "'JetBrainsMonoNL Nerd Font 14'" }
