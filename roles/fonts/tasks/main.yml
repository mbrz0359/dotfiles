---
- name: Create fonts directory
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.local/share/fonts"
    state: directory
    mode: "0755"

- name: Install JetBrains Mono Nerd Font
  ansible.builtin.unarchive:
    src: https://github.com/ryanoasis/nerd-fonts/releases/download/v3.4.0/JetBrainsMono.zip
    dest: "{{ ansible_facts['user_dir'] }}/.local/share/fonts"
    include: JetBrainsMonoNLNerdFont-Regular.ttf
    remote_src: true
    creates: "{{ ansible_facts['user_dir'] }}/.local/share/fonts/JetBrainsMonoNLNerdFont-Regular.ttf"

- name: Set GNOME font settings
  community.general.dconf:
    key: "/org/gnome/desktop/interface/{{ item.key }}"
    value: "{{ item.value }}"
  loop_control:
    label: "{{ item.key }}"
  loop:
    - { key: font-antialiasing, value: "'rgba'" }
    - { key: font-hinting, value: "'full'" }
    - { key: font-name, value: "'Adwaita Sans 12'" }
    - { key: monospace-font-name, value: "'JetBrainsMonoNL Nerd Font 14'" }
