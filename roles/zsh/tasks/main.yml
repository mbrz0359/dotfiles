---
- name: Install zsh
  ansible.builtin.package:
    name:
      - zsh
  become: true

- name: Create zsh directory in .local/share
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.local/share/zsh"
    state: directory
    mode: "0755"

- name: Copy .zshrc
  ansible.builtin.copy:
    src: ".zshrc"
    dest: "{{ ansible_facts['user_dir'] }}/.zshrc"
    mode: "0644"

# zsh/<group>/ and zsh/<host>/ apply to that group or host
- name: Copy custom config
  ansible.builtin.copy:
    src: "zsh/{{ item }}/"
    dest: "{{ ansible_facts['user_dir'] }}/.config/zsh/"
    mode: "0644"
  loop: "{{ ['common'] + group_names + [inventory_hostname] }}"
  when: (role_path ~ '/files/zsh/' ~ item) is directory

- name: Install oh-my-zsh
  ansible.builtin.git:
    repo: https://github.com/ohmyzsh/ohmyzsh.git
    dest: ~/.local/share/oh-my-zsh
    depth: 1

- name: Install zsh plugins
  ansible.builtin.git:
    repo: "{{ item }}"
    depth: 1
    dest: "{{ zsh_plugin_path }}/{{ item | basename | regex_replace('\\.git$', '') }}"
  loop:
    - https://github.com/zsh-users/zsh-autosuggestions.git
    - https://github.com/zsh-users/zsh-syntax-highlighting.git
    - https://github.com/devopstales/zsh-kubecolor.git
    - https://github.com/jeffreytse/zsh-vi-mode
