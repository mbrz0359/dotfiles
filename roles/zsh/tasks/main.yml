---
- name: Install zsh
  ansible.builtin.package:
    name:
      - zsh
  become: true

- name: Create zsh directory in .local/share
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.local/share/zsh"
    state: directory
    mode: "0755"

- name: Copy .zshrc
  ansible.builtin.copy:
    src: ".zshrc"
    dest: "{{ ansible_facts['user_dir'] }}/.zshrc"
    mode: "0644"

# zsh/<group>/ and zsh/<host>/ apply to that group or host
- name: Copy custom config
  ansible.builtin.copy:
    src: "zsh/{{ item }}/"
    dest: "{{ ansible_facts['user_dir'] }}/.config/zsh/"
    mode: "0644"
  loop: "{{ ['common'] + group_names + [inventory_hostname] }}"
  when: (role_path ~ '/files/zsh/' ~ item) is directory

- name: Install oh-my-zsh
  ansible.builtin.git:
    repo: https://github.com/ohmyzsh/ohmyzsh.git
    dest: "{{ zsh_omz_dir }}"
    depth: 1

- name: Install zsh plugins
  ansible.builtin.git:
    repo: "https://github.com/{{ item }}.git"
    depth: 1
    dest: "{{ zsh_omz_dir }}/custom/plugins/{{ item | basename }}"
  loop:
    - zsh-users/zsh-autosuggestions
    - zsh-users/zsh-syntax-highlighting
    - devopstales/zsh-kubecolor
    - jeffreytse/zsh-vi-mode
