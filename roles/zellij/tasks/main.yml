---
- name: Install wl-clipboard
  ansible.builtin.package:
    name:
      - wl-clipboard # required for the clipboard to work on Wayland
  become: true

- name: Install zellij
  ansible.builtin.copy:
    src: "zellij.toml"
    dest: "{{ ansible_facts['user_dir'] }}/.config/mise/conf.d/"
    mode: "0644"
  notify: Mise upgrade

- name: Copy zellij configuration
  ansible.builtin.copy:
    src: "config.kdl"
    dest: "{{ ansible_facts['user_dir'] }}/.config/zellij/"
    mode: "0644"
