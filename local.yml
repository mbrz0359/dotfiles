---
- name: Fedora
  hosts: fedora
  roles:
    - adw-gtk3
    - apps
    - claude
    - cli-tools
    - fonts
    - git
    - gnome
    - k8s-cli-tools
    - morewaita
    - vim
    - zellij
    - zsh

# The Fedora play already gathered facts for these hosts
- name: Desktop
  hosts: desktop
  gather_facts: false
  roles:
    - backup
    - coolercontrol
    - etc-hosts
    - syncthing
    - unit-status

- name: Work
  hosts: work
  gather_facts: false
  roles:
    - docker

- name: Raspberry Pi
  hosts: pi
  roles:
    - ansible-pull
    - audiobookshelf
    - backup
    - cloudflared
    - etc-hosts
    - fresh-rss
    - mealie
    - pihole
    - plex
    - portainer
    - raspberry-pi
    - syncthing
    - unattended-upgrades
    - unit-status
